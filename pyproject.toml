[project]
name = "azure-news"
version = "0.1.0"
description = "Pulls Azure news, keeps the major architecture-relevant updates, and publishes summaries as a static site."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.0",
    "azure-communication-email>=1.0",
    "defusedxml>=0.7",
    "truststore>=0.10",
]

[project.scripts]
azure-news = "azure_news.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/azure_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
